name: Publish Docker images

# Builds and pushes the frontend + backend images to Docker Hub.
# Triggers on version tags (v1.2.3) or manually from the Actions tab.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account (also the image namespace)
#   DOCKERHUB_TOKEN     Docker Hub access token (Account Settings → Security)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: false
        default: "latest"

env:
  VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'http://localhost:8000' }}

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/front-end/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/front-end
      - name: Build frontend
        run: npm run build
        working-directory: app/front-end
      - name: Lint frontend
        run: npm run lint
        working-directory: app/front-end
      - name: Test frontend
        run: npm test
        working-directory: app/front-end

      - name: Install backend dependencies
        run: uv sync --all-extras
        working-directory: app/back-end
      - name: Test backend
        run: uv run pytest tests/ -v
        working-directory: app/back-end

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: app/front-end
      - name: Test user workflow
        run: npx playwright test
        working-directory: app/front-end

      - name: Install documentation dependencies
        run: npm ci
      - name: Build documentation
        run: npm run docs:build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: app/back-end
            image: chronogeolab-backend
          - name: frontend
            context: app/front-end
            image: chronogeolab-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BACKEND_URL=${{ env.VITE_BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
